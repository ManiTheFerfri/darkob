# Issue chooser configuration.
#
# The structured forms are the only entry points into the tracker: a blank
# issue would leave out the version, reproduction and token-redaction details
# that make a report actionable. Questions belong in Discussions.
blank_issues_enabled: false
contact_links:
  - name: Questions and usage help
    url: https://github.com/ManiTheFerfri/darkob/discussions
    about: Ask how to use darkob, share what you built, or discuss a design idea.
  - name: Documentation
    url: https://manitheferfri.github.io/darkob/
    about: Installation, quickstart, guides, and the generated API reference.
  - name: Security vulnerability
    url: https://github.com/ManiTheFerfri/darkob/security/advisories/new
    about: Report a token leak or other vulnerability privately. Never open a public issue for it.
