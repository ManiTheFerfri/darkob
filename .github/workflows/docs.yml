name: Deploy Docs to Pages

on:
  push:
    branches: ["main"]

# Two pushes in quick succession used to race: the second deploy
# failed with "deployment request failed ... in progress deployment".
# Queue them instead of running concurrently.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -e .
      - run: pip install mkdocs-material pymdown-extensions pygments
      - run: python scripts/generate_docs_assets.py
      - run: mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4