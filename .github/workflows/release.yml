name: Release

# Publish to PyPI when a version tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
#
# Uses PyPI Trusted Publishing (OIDC) -- no API token is stored anywhere.
# One-time setup: on pypi.org, add a "pending publisher" for the project
# `darkob` with:
#   Owner:        ManiTheFerfri
#   Repository:   darkob
#   Workflow:     release.yml
#   Environment:  pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI (otherwise build only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify the tag matches the package version
        run: |
          python - <<'PY'
          import os, re, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          ref = os.environ.get("GITHUB_REF_NAME", "")
          print(f"package version: {version}  ref: {ref}")
          if ref.startswith("v"):
              assert ref[1:] == version, f"tag {ref} != version {version}"
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    environment:
      name: pypi
      url: https://pypi.org/p/darkob
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Check whether this version is already on PyPI
        id: check
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://pypi.org/pypi/darkob/${VERSION}/json")
          echo "PyPI returned ${CODE} for version ${VERSION}"
          if [ "${CODE}" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pypa/gh-action-pypi-publish@release/v1
        # Skip a version that is already published, so re-tagging or a
        # manually uploaded release is not reported as a failure.
        if: steps.check.outputs.exists != 'true'
        with:
          skip-existing: true
        # No password: OIDC trusted publishing handles authentication.

  github-release:
    name: create GitHub release
    needs: [build, publish]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
