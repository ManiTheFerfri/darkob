name: CI

on:
  push:
    branches: ["main", "milestone-*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest (26.04) has no Python 3.9 build, so the oldest
        # supported interpreter runs on an older image.
        include:
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.10"
            os: ubuntu-latest
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.14"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest
          - python-version: "3.14"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        run: |
          python -m pytest \
            --cov=darkob \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14

  test-windows:
    name: test (windows, py3.12)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: python -m pip install --upgrade pip ruff

      - name: Ruff
        run: ruff check . --output-format=github

  package:
    name: package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify the wheel installs and imports
        run: |
          python -m pip install dist/*.whl
          cd /tmp && python -c "import darkob; print(darkob.__version__)"

      - name: Check the wheel contains no tests or caches
        run: |
          python -m pip install --upgrade wheel
          python - <<'PY'
          import glob, re, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          bad = [n for n in names if re.search(r"(^|/)(tests?|__pycache__)/", n)]
          print(f"{len(names)} files in wheel")
          assert not bad, f"unwanted files in wheel: {bad[:5]}"
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docs:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install mkdocs-material pymdown-extensions pygments

      # Generated reference output is compared byte-for-byte; keep the
      # generator on the same interpreter that produced the committed files.

      - name: Regenerate API reference and AI assets
        run: python scripts/generate_docs_assets.py

      - name: Fail if generated documentation is stale
        run: |
          if ! git diff --quiet -- docs/api docs/api.json docs/llms-full.txt; then
            echo "::error::Generated docs are stale. Run scripts/generate_docs_assets.py and commit the result."
            git diff --stat -- docs/api docs/api.json docs/llms-full.txt
            exit 1
          fi

      - name: Build the documentation site
        run: mkdocs build

  security:
    name: dependency audit
    runs-on: ubuntu-latest
    # Reported, not enforced: upstream advisories should not block every PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --desc on || true
