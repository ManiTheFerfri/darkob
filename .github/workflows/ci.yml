name: CI

on:
  push:
    branches: ["main", "milestone-*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest (26.04) has no Python 3.9 build, so the oldest
        # supported interpreter runs on an older image.
        include:
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.10"
            os: ubuntu-latest
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest
          - python-version: "3.14"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        run: |
          python -m pytest \
            --cov=darkob \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=30

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14

  test-windows:
    name: test (windows, py3.12)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip ruff

      - name: Ruff
        run: ruff check . --output-format=github

  package:
    name: package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify the wheel installs and imports
        run: |
          python -m pip install dist/*.whl
          cd /tmp && python -c "import darkob; print(darkob.__version__)"

      - name: Check the wheel contains no tests or caches
        run: |
          python -m pip install --upgrade wheel
          python - <<'PY'
          import glob, re, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          bad = [n for n in names if re.search(r"(^|/)(tests?|__pycache__)/", n)]
          print(f"{len(names)} files in wheel")
          assert not bad, f"unwanted files in wheel: {bad[:5]}"
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docs:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Generated reference output is compared byte-for-byte, so the docs
      # generator runs on the same interpreter that produced the artifacts.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install mkdocs-material pymdown-extensions pygments

      - name: Regenerate API reference and AI assets
        run: python scripts/generate_docs_assets.py

      - name: Fail if generated documentation is stale
        run: |
          if ! git diff --quiet -- docs/api docs/api.json docs/llms-full.txt; then
            echo "::error::Generated docs are stale. Run scripts/generate_docs_assets.py and commit the result."
            git diff --stat -- docs/api docs/api.json docs/llms-full.txt
            exit 1
          fi

      - name: Build the documentation site
        run: mkdocs build

  typing:
    name: typing (new modules)
    runs-on: ubuntu-latest
    # Strict mode over the modules written for typing. Enforced: these
    # six modules must stay clean.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          python -m pip install --upgrade pip mypy
          mypy darkob/router.py darkob/retry.py darkob/builders.py \
               darkob/keyboards.py darkob/formatting.py darkob/testing.py

  pyright:
    name: pyright (new modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pyright
        run: npm install -g pyright

      # Blocking: every module written for typing support must stay clean.
      - name: Type-check the new modules
        run: pyright darkob/utils darkob/crypto.py darkob/converse.py darkob/states.py darkob/circuit.py darkob/ratelimit.py darkob/queue.py darkob/protocol.py darkob/builders.py darkob/keyboards.py darkob/retry.py darkob/testing.py

      - name: Report package type completeness
        continue-on-error: true
        run: pyright --verifytypes darkob

  benchmark:
    name: benchmarks
    runs-on: ubuntu-latest
    # Blocking. The gate compares *derived* quantities only — darkob-vs-
    # maxrubika factors (both measured on this same runner, so the comparison
    # is machine-independent) and calibration-normalised scenario ratios —
    # never an absolute duration. The scenario tolerance is wider because the
    # committed baseline was recorded on another platform.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install maxrubika

      - name: Head-to-head comparison
        run: python benchmarks/benchmark_suite.py | tee head-to-head.md

      - name: Scenario benchmarks
        run: python benchmarks/scenarios.py | tee scenarios.md

      - name: Fail on a performance regression
        run: |
          python benchmarks/check_regression.py \
            --tolerance 0.25 --scenario-tolerance 0.75

      - name: Publish the results to the job summary
        if: always()
        run: |
          {
            echo '## Head-to-head vs maxrubika'
            echo
            cat head-to-head.md || true
            echo
            echo '## Scenarios'
            echo
            cat scenarios.md || true
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: |
            head-to-head.md
            scenarios.md
          retention-days: 30

  docstrings:
    name: docstring examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Every ``>>>`` block in the package is executed, and the count is
      # ratcheted so examples cannot be quietly deleted.
      - name: Run every executable docstring example
        run: python -m pytest tests/test_docstrings.py -v

      - name: Report how much of the public API has a verified example
        continue-on-error: true
        run: python scripts/docstring_coverage.py --top 20

  security:
    name: security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pip-audit bandit

      # Scoped to the modules written for darkob, the same way mypy and
      # pyright are: the inherited tree has not been triaged yet, and a gate
      # that is red on day one is a gate nobody reads.
      - name: Static analysis (bandit, medium severity and up)
        run: |
          bandit -ll -q \
            darkob/ratelimit.py darkob/queue.py darkob/retry.py \
            darkob/circuit.py darkob/protocol.py darkob/states.py \
            darkob/converse.py darkob/crypto.py darkob/metrics.py \
            darkob/health.py darkob/plugin.py darkob/formatting.py \
            darkob/keyboards.py darkob/builders.py darkob/utils

      # Blocking only when an advisory affects a runtime dependency. A
      # `pytest` or `setuptools` advisory must not fail a pull request.
      - name: Dependency audit
        run: python scripts/audit_gate.py
