[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "darkob"
version = "0.19.1"
description = "Fast, stable async Python library for the Rubika & Shad platforms - build bots and userbots."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
# `authors` means "author of *this* distribution", so it names the person who
# writes darkob. Upstream credit for maxrubika belongs to MEHRAB Farahmand and
# is preserved in three other places, all of which ship: the MIT notice in
# LICENSE, `project.urls.Upstream` below, and the prose in README/CONTRIBUTING.
# Listing him here instead conflated "whose code this derives from" with "who
# publishes this package", which is not what the field is for.
authors = [
    { name = "Mani Keikhosravi", email = "darkking7055@gmail.com" },
]
maintainers = [
    { name = "Mani Keikhosravi", email = "darkking7055@gmail.com" },
]
keywords = [
    "darkob",
    "rubika",
    "shad",
    "bot",
    "robot",
    "asyncio",
    "client",
    "userbot",
    "self-bot",
]
classifiers = [
    # Pre-1.0 on purpose: the public surface is stable and additive, but
    # SemVer still allows a breaking change in a minor release.
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Communications :: Chat",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    # Range specifiers, not pins: a hard pin here becomes a resolver conflict
    # in every downstream project. The upper bounds guard against a major
    # release that changes semantics under us.
    "aiohttp>=3.9,<4",
    "aiofiles>=22.1,<26",
    "pycryptodome>=3.20,<4",
]

[project.optional-dependencies]
speed = ["msgspec>=0.18"]
cli = ["rich>=13.7"]
opencv = ["opencv-python"]
movie = ["numpy", "moviepy"]
pillow = ["pillow"]
aiortc = ["aiortc"]
pro = ["aiortc", "pillow", "opencv-python", "numpy", "moviepy", "rich", "msgspec"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/ManiTheFerfri/darkob"
Documentation = "https://ManiTheFerfri.github.io/darkob"
Repository = "https://github.com/ManiTheFerfri/darkob"
Issues = "https://github.com/ManiTheFerfri/darkob/issues"
Upstream = "https://github.com/MEH2RAB/maxrubika"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
darkob = ["py.typed"]

[tool.setuptools.packages.find]
include = ["darkob*"]

# ---------------------------------------------------------------------------
# Linting
#
# Scope is deliberately conservative: these rules catch real defects (syntax
# errors, undefined names, redefinitions) without drowning the 20k-line
# inherited codebase in style noise. Tighten as the cleanup progresses.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py39"
src = ["darkob", "tests"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = []

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
follow_imports = "silent"

[[tool.mypy.overrides]]
module = [
    "darkob.retry",
    "darkob.builders",
    "darkob.keyboards",
    "darkob.formatting",
    "darkob.testing",
    "darkob.router",
]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers -p no:cacheprovider"
filterwarnings = [
    "error::SyntaxWarning",
]
